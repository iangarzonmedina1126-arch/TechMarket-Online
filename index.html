<script>
try {
    const savedTheme = localStorage.getItem('tm-theme');
    document.documentElement.classList.toggle(
        'theme-dark',
        savedTheme !== 'light'
    );
} catch (error) {
    document.documentElement.classList.add('theme-dark');
}
</script>
