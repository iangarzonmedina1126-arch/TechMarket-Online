services:
  - type: web
    name: techmarket-online
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "17112"
      - key: MYSQL_DATABASE
        value: defaultdb
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_CA_PATH
        value: /etc/secrets/ca.pem
